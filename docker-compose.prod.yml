version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: flowstock-db-prod
    restart: always
    environment:
      POSTGRES_USER: flowstock
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: flowstock
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstock"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowstock-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flowstock-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowstock-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # FlowStock Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowstock:latest
    container_name: flowstock-web-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://flowstock:${DATABASE_PASSWORD}@postgres:5432/flowstock?schema=public&pgbouncer=true&connection_limit=10
      DIRECT_URL: postgresql://flowstock:${DATABASE_PASSWORD}@postgres:5432/flowstock?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTO_MIGRATE: "false"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - flowstock-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health/live', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Nginx Reverse Proxy for SSL/TLS
  nginx:
    image: nginx:alpine
    container_name: flowstock-nginx-prod
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx-cache:/var/cache/nginx
    networks:
      - flowstock-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  flowstock-network:
    driver: bridge
