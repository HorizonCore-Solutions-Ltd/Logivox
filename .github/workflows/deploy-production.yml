name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: logivox-production
  NAMESPACE: production

jobs:
  approve:
    name: Approval Gate
    runs-on: ubuntu-latest
    environment:
      name: production-approval
    steps:
      - name: Manual approval required
        run: echo "Deployment approved"

  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: [approve]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tag format
        run: |
          if [[ ! "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Use semantic versioning (v1.2.3)"
            exit 1
          fi

      - name: Check for breaking changes
        run: |
          echo "Checking for breaking database migrations..."
          # Add logic to detect breaking changes

      - name: Verify tests passed
        run: |
          echo "All tests must pass before production deployment"

  backup-database:
    name: Backup Production Database
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger RDS snapshot
        run: |
          SNAPSHOT_ID="pre-deploy-$(date +%Y%m%d-%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier logivox-production \
            --db-snapshot-identifier $SNAPSHOT_ID
          
          echo "Created snapshot: $SNAPSHOT_ID"
          echo "snapshot_id=$SNAPSHOT_ID" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backup-database]
    environment:
      name: production
      url: https://app.logivox.ai
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Set image tag
        id: image
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update K8s deployment
        run: |
          kubectl set image deployment/logivox-web \
            logivox-web=${{ steps.image.outputs.tag }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/logivox-web -n ${{ env.NAMESPACE }} --timeout=10m

      - name: Run database migrations
        run: |
          kubectl exec -n ${{ env.NAMESPACE }} \
            deployment/logivox-web -- \
            npx prisma migrate deploy

      - name: Run smoke tests
        run: |
          sleep 60
          curl -f https://app.logivox.ai/api/health || exit 1
          curl -f https://app.logivox.ai/ || exit 1
          
          # Test authentication endpoint
          curl -f https://app.logivox.ai/api/auth/signin || exit 1
          
          # Test critical API endpoints
          curl -f https://app.logivox.ai/api/admin/health || exit 1

      - name: Verify deployment
        run: |
          # Check pod health
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=logivox-web
          
          # Check service endpoints
          kubectl get endpoints -n ${{ env.NAMESPACE }}
          
          # Verify ingress
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.image.outputs.version }}
          release_name: Release ${{ steps.image.outputs.version }}
          body: |
            Production deployment of LogiVox WMS ${{ steps.image.outputs.version }}
            
            Deployed at: ${{ github.event.repository.updated_at }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: custom
          custom_payload: |
            {
              text: '🚀 Production deployment successful',
              attachments: [{
                color: 'good',
                text: `Deployed version ${{ steps.image.outputs.version }} to production\nURL: https://app.logivox.ai`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify deployment failure
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: custom
          custom_payload: |
            {
              text: '🚨 Production deployment FAILED',
              attachments: [{
                color: 'danger',
                text: `Failed to deploy version ${{ steps.image.outputs.version }} to production\n@channel Please investigate immediately!`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  rollback:
    name: Rollback (if needed)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/logivox-web -n production
          kubectl rollout status deployment/logivox-web -n production

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '⚠️ Rolled back production deployment',
              attachments: [{
                color: 'warning',
                text: 'Production has been rolled back to the previous version'
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
