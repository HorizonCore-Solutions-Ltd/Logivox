name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: logivox-staging
  NAMESPACE: staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.logivox.ai
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Set image tag
        id: image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Update K8s deployment
        run: |
          kubectl set image deployment/logivox-web \
            logivox-web=${{ steps.image.outputs.tag }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/logivox-web -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Run database migrations
        run: |
          kubectl exec -n ${{ env.NAMESPACE }} \
            deployment/logivox-web -- \
            npx prisma migrate deploy

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://staging.logivox.ai/api/health || exit 1
          curl -f https://staging.logivox.ai/ || exit 1

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: custom
          custom_payload: |
            {
              text: '✅ Staging deployment successful',
              attachments: [{
                color: 'good',
                text: `Deployed ${process.env.AS_COMMIT} to staging\nURL: https://staging.logivox.ai`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify deployment failure
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: custom
          custom_payload: |
            {
              text: '❌ Staging deployment failed',
              attachments: [{
                color: 'danger',
                text: `Failed to deploy ${process.env.AS_COMMIT} to staging`
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
