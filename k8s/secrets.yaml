apiVersion: v1
kind: Secret
metadata:
  name: flowstock-secrets
  namespace: production
type: Opaque
stringData:
  # Database
  database-url: "postgresql://username:password@postgres-service:5432/flowstock?schema=public"
  
  # Redis
  redis-url: "redis://:password@redis-service:6379"
  
  # Authentication
  nextauth-secret: "CHANGE_ME_IN_PRODUCTION"
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  
  # Monitoring (optional)
  sentry-dsn: ""
  
  # Email (optional)
  smtp-host: ""
  smtp-user: ""
  smtp-password: ""
  
  # External APIs (optional)
  stripe-secret-key: ""
  aws-access-key-id: ""
  aws-secret-access-key: ""
