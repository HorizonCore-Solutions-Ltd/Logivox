apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flowstock-uploads-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can read/write
  storageClassName: standard  # Adjust based on your cloud provider
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-ssd  # Use SSD for database
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-ssd
  resources:
    requests:
      storage: 10Gi
